name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set S3 bucket name
        id: s3-bucket
        run: |
          # Hardcoded bucket name (matches Terraform configuration)
          BUCKET_NAME="webwaka-frontend-production"
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "Bucket name: $BUCKET_NAME"

      - name: Sync files to S3
        working-directory: ./frontend
        run: |
          aws s3 sync dist/ s3://${{ steps.s3-bucket.outputs.bucket_name }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          
          # Upload index.html separately with no-cache
          aws s3 cp dist/index.html s3://${{ steps.s3-bucket.outputs.bucket_name }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

      # CloudFront is disabled temporarily (AWS account verification required)
      # Will be re-enabled once CloudFront access is granted

      - name: Deployment summary
        run: |
          echo "✅ Frontend deployed successfully!"
          echo "📦 S3 Bucket: ${{ steps.s3-bucket.outputs.bucket_name }}"
          echo "🔗 Website URL: http://webwaka-frontend-production.s3-website-us-east-1.amazonaws.com"
          echo ""
          echo "⚠️  Note: Using S3 website hosting (HTTP only)"
          echo "CloudFront + HTTPS will be enabled once AWS account is verified"
