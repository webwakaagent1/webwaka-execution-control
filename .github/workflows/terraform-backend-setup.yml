name: Terraform Backend Setup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "SETUP" to confirm Terraform backend setup'
        required: true
        type: string

jobs:
  setup-backend:
    name: Setup Terraform Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "SETUP" ]; then
            echo "❌ Invalid confirmation. Please type 'SETUP' to proceed."
            exit 1
          fi
          echo "✅ Confirmation validated"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Create S3 bucket for Terraform state
        run: |
          BUCKET_NAME="webwaka-terraform-state-us-east-1"
          
          echo "Creating S3 bucket: $BUCKET_NAME"
          
          # Check if bucket exists
          if aws s3 ls "s3://$BUCKET_NAME" 2>&1 | grep -q 'NoSuchBucket'; then
            # Create bucket
            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region us-east-1
            
            echo "✅ Bucket created: $BUCKET_NAME"
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET_NAME" \
              --versioning-configuration Status=Enabled
            
            echo "✅ Versioning enabled"
            
            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET_NAME" \
              --server-side-encryption-configuration '{
                "Rules": [{
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  },
                  "BucketKeyEnabled": true
                }]
              }'
            
            echo "✅ Encryption enabled"
            
            # Block public access
            aws s3api put-public-access-block \
              --bucket "$BUCKET_NAME" \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            
            echo "✅ Public access blocked"
            
            # Add tags
            aws s3api put-bucket-tagging \
              --bucket "$BUCKET_NAME" \
              --tagging 'TagSet=[
                {Key=Project,Value=WebWaka},
                {Key=Environment,Value=production},
                {Key=ManagedBy,Value=Terraform},
                {Key=Phase,Value=Phase1}
              ]'
            
            echo "✅ Tags added"
          else
            echo "ℹ️ Bucket already exists: $BUCKET_NAME"
          fi
      
      - name: Create DynamoDB table for state locking
        run: |
          TABLE_NAME="webwaka-terraform-locks"
          
          echo "Creating DynamoDB table: $TABLE_NAME"
          
          # Check if table exists
          if ! aws dynamodb describe-table --table-name "$TABLE_NAME" --region us-east-1 2>/dev/null; then
            # Create table
            aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1 \
              --tags \
                Key=Project,Value=WebWaka \
                Key=Environment,Value=production \
                Key=ManagedBy,Value=Terraform \
                Key=Phase,Value=Phase1
            
            echo "✅ DynamoDB table created: $TABLE_NAME"
            
            # Wait for table to be active
            echo "⏳ Waiting for table to be active..."
            aws dynamodb wait table-exists --table-name "$TABLE_NAME" --region us-east-1
            
            echo "✅ Table is active"
          else
            echo "ℹ️ Table already exists: $TABLE_NAME"
          fi
      
      - name: Verify backend resources
        run: |
          echo "🔍 Verifying Terraform backend resources..."
          
          # Verify S3 bucket
          BUCKET_NAME="webwaka-terraform-state-us-east-1"
          if aws s3 ls "s3://$BUCKET_NAME" >/dev/null 2>&1; then
            echo "✅ S3 bucket verified: $BUCKET_NAME"
          else
            echo "❌ S3 bucket not found: $BUCKET_NAME"
            exit 1
          fi
          
          # Verify DynamoDB table
          TABLE_NAME="webwaka-terraform-locks"
          if aws dynamodb describe-table --table-name "$TABLE_NAME" --region us-east-1 >/dev/null 2>&1; then
            echo "✅ DynamoDB table verified: $TABLE_NAME"
          else
            echo "❌ DynamoDB table not found: $TABLE_NAME"
            exit 1
          fi
          
          echo ""
          echo "🎉 Terraform backend setup complete!"
          echo ""
          echo "Backend configuration:"
          echo "  S3 Bucket: $BUCKET_NAME"
          echo "  DynamoDB Table: $TABLE_NAME"
          echo "  Region: us-east-1"
